[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira-cost-tracker"
version = "0.1.0"
description = "Jira worklog cost tracker with TUI and Excel export"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60",
    "typer>=0.12",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "openpyxl>=3.1",
    "pydantic-settings>=2.1",
    "loguru>=0.7",
]

[project.scripts]
tracker = "cost_tracker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_tracker"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
